<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏛️%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 2 — Then and Now</title>
<style>
:root{--bg:#fff8ec;--ink:#1d2b3a;--blue:#1565c0;--green:#2e7d32;--orange:#e65100;--purple:#6a1b9a;--line:#d9d2c3}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.5}
header{background:var(--blue);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:20px;margin:0}
main{max-width:760px;margin:0 auto;padding:18px}
button{font:inherit;min-height:48px;padding:10px 18px;border-radius:14px;border:0;background:var(--orange);color:#fff;font-weight:700;cursor:pointer;margin:4px}
button:disabled{cursor:default}
button.alt{background:#fff;color:var(--blue);border:2px solid var(--blue)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #ffb300;outline-offset:2px}
.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.opt{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:2px solid var(--line);margin:6px 0;font-weight:600}
.opt.right{background:#c8e6c9;border-color:var(--green)}
.opt.wrong{background:#ffcdd2;border-color:#c62828}
.fb{padding:10px 14px;border-radius:12px;margin-top:10px;font-weight:600}
.fb:empty{display:none}
.ok{background:#e8f5e9;color:var(--green)}.no{background:#ffebee;color:#c62828}
.bar{height:12px;background:var(--line);border-radius:8px;overflow:hidden}
.bar div{height:100%;background:var(--green);transition:width .3s}
.big{font-size:44px;text-align:center}
.c-s{color:var(--blue);font-weight:700}.c-d{color:var(--purple);font-weight:700}.c-b{color:var(--green);font-weight:700}.c-p{color:var(--orange);font-weight:700}
textarea{width:100%;min-height:180px;font:inherit;padding:12px;border-radius:12px;border:2px solid var(--line)}
input[type=text]{font:inherit;padding:10px;border-radius:12px;border:2px solid var(--line);min-height:48px;width:100%}
.flip{width:100%;min-height:140px;margin:0;background:#e3f2fd;color:var(--ink);font-size:24px;border-radius:18px;white-space:normal}
.tl{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:center;flex-wrap:wrap}
.tl div{flex:1;min-width:120px;background:#eef;border-radius:12px;padding:10px}
.note{font-size:15px;color:#555}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{border:1px solid var(--line);padding:6px;vertical-align:top;text-align:left}
.spk{min-height:40px;padding:6px 12px;border-radius:12px;border:2px solid var(--blue);background:#fff;color:var(--blue);font-weight:700;cursor:pointer;margin:2px}
.row{display:flex;gap:6px;align-items:center}.row .opt{flex:1}
body{padding-bottom:96px}
#spctl{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid var(--line);padding:8px;text-align:center;z-index:5}
#spctl button{min-height:44px;font-size:16px;margin:2px}
#spmsg{font-size:14px;color:#c62828;min-height:1em}
#nav{position:sticky;top:0;z-index:4;background:#fff;border-bottom:2px solid var(--line);padding:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
#nav button{min-height:52px;font-size:17px;margin:0}
#nav button:disabled{opacity:.4}
.dash{color:var(--ink);background:#fff;text-align:center;width:100%;margin:0;min-height:120px;font-size:17px;border:2px solid var(--line)}
.dash:hover{border-color:var(--blue)}
body.listen .spk{font-size:20px;min-height:56px;background:#e3f2fd}
@media print{#spctl{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{header,.noprint{display:none!important}body{background:#fff}.card{box-shadow:none}}
</style>
</head>
<body>
<header><h1>Unit 2 — Then and Now</h1><span id="hp"></span><button class="alt" data-act="lmode" aria-pressed="false" style="margin:0">🔊 Listening Mode: off</button></header>
<nav id="nav" aria-label="Lesson navigation"><button data-act="home" aria-label="Home">🏠 Home</button><button class="alt" data-act="prev" aria-label="Previous">⬅️ Previous</button><button class="alt" data-act="next" aria-label="Next">➡️ Next</button><button class="alt" data-act="listenNow" aria-label="Listen">🔊 Listen</button><button class="alt" data-act="again" aria-label="Try again">🔄 Try Again</button></nav>
<main id="main" tabindex="-1"></main>
<div id="spctl"><button class="alt" data-spk="again">🔁 Listen again</button><button class="alt" data-spk="pause">⏸ Pause</button><button class="alt" data-spk="resume">▶ Resume</button><button class="alt" data-spk="stop">⏹ Stop</button><div id="spmsg" aria-live="polite"></div></div>

<script>
const $=s=>document.querySelector(s);
const KEY='unit2-then-now-v1';
let P={seen:{},best:null,last:null};
try{const r=localStorage.getItem(KEY);if(r)P=Object.assign(P,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){}}
const countSeen=()=>['vocab','past','g1','g2','read','write','museum','quiz'].filter(k=>P.seen[k]).length;

const VOCAB=[
{w:'computer',i:'💻',m:'a machine you use to write, search, and play games',e:'We use a computer at school.'},
{w:'keyboard',i:'⌨️',m:'the buttons you press to type letters and numbers',e:'Press the keys on the keyboard.'},
{w:'mouse',i:'🖱️',m:'a small device you move to point at things on a screen',e:'Use the mouse to open the file.'},
{w:'tablet',i:'📱',m:'a flat, portable device you touch with your fingers',e:'She reads stories on her tablet.'},
{w:'email',i:'📧',m:'a message sent electronically from one person to another',e:'I sent an email to my teacher.'},
{w:'letter',i:'✉️',m:'a written message sent in an envelope by post',e:'He wrote a letter to his grandmother.'},
{w:'telephone',i:'☎️',m:'a device used to talk to people who are far away',e:'The old telephone was in the hall.'},
{w:'mobile phone',i:'📲',m:'a small phone you can carry in your pocket',e:'My mobile phone has a camera.'},
{w:'CD player',i:'💿',m:'a machine that plays music from a CD',e:'Dad had a CD player in his car.'},
{w:'carry',i:'🎒',m:'to hold something and move it from one place to another',e:'I carry my books to school.'},
{w:'call',i:'📞',m:'to phone someone',e:'I will call you after school.'},
{w:'study',i:'📚',m:'to learn about something by reading and practising',e:'We study English every day.'}
];
const ACTIONS=['post a letter','send an email','make a face','tell a story','hold a pen','win a race','make a sandwich','tie a shoelace'];

const REG={};
function mc(id,q,opts,a,e){REG[id]={a,e};return `<div class="card" data-mc="${id}"><p><b>${q}</b> ${ls(q)}</p>${opts.map((o,k)=>`<div class="row"><button class="opt" data-act="pick" data-id="${id}" data-k="${k}">${o}</button>${ls(o)}</div>`).join('')}<div class="fb" aria-live="polite"></div></div>`;}
const TF=(id,q,ans,e)=>mc(id,q,['True','False'],ans?0:1,e);

const FC={i:0,f:false};
function fcHtml(){const v=VOCAB[FC.i];return `<div class="card"><p>Flashcard ${FC.i+1} of ${VOCAB.length} <span class="note">(tap the card to flip)</span></p><button class="flip" data-act="flip" aria-label="Flip flashcard">${FC.f?`<span>${v.m}</span>`:`<span>${v.i} ${v.w}</span>`}</button><p style="text-align:center">${ls(FC.f?v.m:v.w)} <button class="alt" data-act="fc" data-d="-1">← Previous</button><button data-act="fc" data-d="1">Next →</button></p></div>`;}

const VIEWS={};
VIEWS.home=()=>`<div class="card" style="text-align:center"><div class="big" aria-hidden="true">🖥️ 📱 ⌨️ 📞</div><h2 tabindex="-1">Unit 2 — Then and Now</h2><p>Grade 5 English</p><p>Explore technology in the past and today.</p><p class="note"><b>Teacher:</b> Salem Rashid Al-Harbi<br><b>School:</b> Imam Al-Salt bin Al-Qasim Al-Kharousi Basic Education School (Grades 5–8)</p><p><button data-go="menu">Start Learning</button></p><p>Sections explored: <b>${countSeen()}/8</b>${P.best!=null?` · Best quiz: <b>${P.best}%</b>`:''}</p><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="8" aria-valuenow="${countSeen()}"><div style="width:${countSeen()/8*100}%"></div></div><p class="note">Progress is saved only in this browser on this device. It is not synchronised across devices.</p></div>`;

VIEWS.menu=()=>`<h2 tabindex="-1">Choose an activity</h2><div class="grid">${[['vocab','📚 Vocabulary Lab'],['past','⏳ Past vs Present'],['g1','🕰️ Grammar 1: Past Simple'],['g2','💪 Grammar 2: Could / Couldn’t'],['read','🔬 Reading Challenge'],['write','✍️ Writing Workshop'],['steps','🪜 Step-by-Step Writing'],['museum','🏛️ Museum Visit Report'],['quiz','🏆 Interactive Quiz'],['results','📊 Results & Progress']].map(([k,l])=>`<button class="alt" data-go="${k}">${l}</button>`).join('')}</div><p class="noprint"><button class="alt" data-act="reset">Reset progress</button></p>`;

VIEWS.vocab=()=>{
 const cards=VOCAB.map(v=>`<div class="card"><span style="font-size:32px">${v.i}</span> <b class="c-s">${v.w}</b> ${ls(v.w)}<p>${v.m}</p><p><i>e.g. ${v.e}</i> ${ls(v.e)}</p></div>`).join('');
 const mcs=VOCAB.map((v,i)=>{const o=[v.w,VOCAB[(i+4)%12].w,VOCAB[(i+8)%12].w];const ord=[0,1,2].map(k=>o[(k+i)%3]);return mc('v'+i,`${v.i} Which word means: “${v.m}”?`,ord,ord.indexOf(v.w),`${v.w} = ${v.m}.`);}).join('');
 const sp=[0,2,5,7,9,11].map(i=>`<div class="card"><p>${VOCAB[i].i} ${VOCAB[i].m}</p><input type="text" id="sp${i}" aria-label="Spell the word"><p><button data-act="spell" data-i="${i}">Check spelling</button></p><div class="fb" aria-live="polite"></div></div>`).join('');
 return `<h2 tabindex="-1">Vocabulary Lab</h2><h3>Words</h3>${cards}<h3>Action phrases</h3><div class="card">${ACTIONS.map(a=>`<span class="c-p" style="margin-right:12px">${a}</span>${ls(a)}`).join('')}</div><h3>Flashcards</h3><div id="fc">${fcHtml()}</div><h3>Match the word</h3>${mcs}<h3>Spelling</h3>${sp}`;
};
ACT_FC=null;

VIEWS.past=()=>`<h2 tabindex="-1">Past vs Present</h2>
<div class="card"><p><b>Timeline</b></p><div class="tl"><div><b>Then (past)</b><br>letters<br>traditional telephones<br>CD players</div>→<div><b>Now (today)</b><br>email<br>mobile phones<br>tablets</div></div></div>
<div class="grid"><div class="card"><b>Writing to a friend</b><p>Then: a letter by post. Now: an email.</p></div><div class="card"><b>Calling home</b><p>Then: a telephone in one place. Now: a mobile phone you carry.</p></div><div class="card"><b>Listening to music</b><p>Then: a CD player. Now: music on a tablet or phone.</p></div></div>
<p class="note">These examples are illustrations created for this app. They are not claims made in the textbook.</p>
${mc('p1','Which is the more modern way to send a message?',['a letter','an email'],1,'Email is a newer way to send messages.')}
${mc('p2','Which device did families use in the past?',['a tablet','a telephone in the house'],1,'Many families had one telephone in one place.')}
${mc('p3','Which is a device people carry today?',['a mobile phone','a CD player'],0,'Mobile phones are small enough to carry.')}`;

VIEWS.g1=()=>`<h2 tabindex="-1">Grammar Lab 1 — Past Simple</h2>
<div class="card"><p><b>Colour key:</b> <span class="c-s">subject</span> · <span class="c-p">past verb</span> · <span class="c-d">did / didn’t</span> · <span class="c-b">base verb</span></p>
<p><b>Positive:</b> <span class="c-s">We</span> <span class="c-p">had</span> a phone in the house.</p>
<p><b>Negative:</b> <span class="c-s">We</span> <span class="c-d">didn’t</span> <span class="c-b">have</span> a mobile phone.</p>
<p><b>Question:</b> <span class="c-d">Did</span> <span class="c-s">you</span> <span class="c-b">have</span> a phone ten years ago?</p>
<p><b>Short answers:</b> Yes, I <span class="c-d">did</span>. / No, I <span class="c-d">didn’t</span>.</p>
<p><b>Regular verbs:</b> play → played, call → called, study → studied.</p>
<p><b>Common irregular verbs:</b> have → had, go → went, buy → bought, write → wrote, see → saw.</p></div>
<div class="card"><b>Important:</b> after <i>did</i> or <i>didn’t</i>, use the base verb. Say “didn’t have”, not “didn’t had”.</div>
${mc('g1a','Yesterday we ___ a new computer.',['buy','bought','buyed'],1,'Buy is irregular: buy → bought.')}
${mc('g1b','We ___ a phone in the house.',['had','have','haved'],0,'Have is irregular: have → had.')}
${mc('g1c','I ___ to the cinema yesterday.',['didn’t went','didn’t go','didn’t goed'],1,'After didn’t, use the base verb: go.')}
${mc('g1d','___ you watch TV last night?',['Did','Do','Was'],0,'Questions in the past use Did.')}
${mc('g1e','They ___ football at school.',['played','plays','playing'],0,'Regular verbs add -ed in the past.')}
${mc('g1f','Did you ___ the letter?',['wrote','write','written'],1,'After did, use the base verb: write.')}`;

VIEWS.g2=()=>`<h2 tabindex="-1">Grammar Lab 2 — Could / Couldn’t</h2>
<div class="card"><p><b>Timeline</b></p><div class="tl"><div>Age 1<br>✔ walk<br>✘ talk</div><div>Age 5<br>✔ ride a bike</div></div></div>
<div class="card"><p><span class="c-s">Subject</span> + <span class="c-p">could</span> / <span class="c-p">couldn’t</span> + <span class="c-b">base verb</span></p>
<p>When I was one, I <span class="c-p">could</span> <span class="c-b">walk</span>.</p>
<p>I <span class="c-p">couldn’t</span> <span class="c-b">talk</span> when I was one.</p>
<p><span class="c-p">Could</span> you <span class="c-b">ride</span> a bike when you were five?</p>
<p>Yes, I <span class="c-p">could</span>. / No, I <span class="c-p">couldn’t</span>.</p></div>
${mc('g2a','When I was one, I ___ walk.',['could','couldn’t','can'],0,'Could describes past ability.')}
${mc('g2b','I ___ talk when I was one.',['could','couldn’t','did'],1,'Couldn’t describes a past ability you did not have.')}
${mc('g2c','___ you ride a bike when you were five?',['Could','Did','Can'],0,'Questions use Could + subject + base verb.')}
${mc('g2d','Error correction: which sentence is correct?',['I couldn’t walk when I was one.','I could walked when I was one.','I couldn’t walks when I was one.'],0,'After could or couldn’t, use the base verb.')}
${mc('g2e','Error correction: which question is correct?',['Could you ride a bike?','Could you rode a bike?','Did you could ride a bike?'],0,'Could + subject + base verb.')}`;

VIEWS.read=()=>`<h2 tabindex="-1">Reading Challenge</h2>
<div class="card" id="rt"><h3>Phones Then and Now</h3><p><button class="spk" data-sayel="rt">🔊 Listen to the text</button></p><p>Think about your grandparents when they were children. Their house may have had one telephone, and it stayed in one place. Nobody could carry it to the garden.</p><p>Today, most families have mobile phones. They are small, light, and can take photos, too. Ten years ago, many children could not use a tablet at school. Now they study with tablets and laptops.</p><p>Technology changes quickly, but one thing stays the same: people still want to share news and stories.</p></div>
${mc('r1','In the past, where was the telephone?',['in a pocket','in one place in the house','at school only'],1,'The text says it stayed in one place.')}
${mc('r2','What can a mobile phone do in the text?',['only make calls','take photos','play CDs only'],1,'The text says mobile phones can take photos.')}
${mc('r3','What is the main idea?',['Technology never changes.','Technology has changed, but people still share news.','Computers are only for adults.'],1,'The last paragraph gives the main idea.')}
${TF('r4','True or false: Families once had one telephone in the house.',true,'The text says their house may have had one telephone.')}
${TF('r5','True or false: Mobile phones are big and heavy.',false,'The text says they are small and light.')}
${mc('r6','Vocabulary in context: “it stayed in one place”. What does “stayed” mean?',['moved','remained','broke'],1,'Stayed means remained in the same place.')}`;

VIEWS.write=()=>`<h2 tabindex="-1">Writing Workshop: “Then and Now”</h2>
<div class="card"><b>Model report</b> <button class="spk" data-sayel="mrt">🔊 Listen</button><div id="mrt"><p><b>Then and Now</b></p><p>Technology is very different now from the past. In this report, I compare my grandfather’s time with today.</p><p>My grandfather had a telephone in the house. It was black and heavy. He could not call anyone while he was walking outside. Today, my father has a mobile phone. He can send an email and take photos. I have a tablet, and I study with it at home.</p><p>In conclusion, technology has changed a lot. Now we can talk to people faster than before.</p></div></div>
<div class="card"><b>Structure</b><p>Title → Introduction → Examples (past and present) → Conclusion</p><b>Sentence starters</b><ul><li>In the past, people…</li><li>Today, we can…</li><li>When my grandfather was young, he…</li><li>In conclusion, …</li></ul></div>
<div class="card"><label for="wr"><b>Your report</b></label><textarea id="wr" placeholder="Start with the title: Then and Now"></textarea><p>Word count: <b id="wc">0</b></p></div>
<div class="card"><b>Checklist</b>
<label><input type="checkbox"> I used a title and capital letters at the start of sentences.</label><br>
<label><input type="checkbox"> I used a full stop at the end of each sentence.</label><br>
<label><input type="checkbox"> I used the past form after <i>had</i> and <i>could</i> only where correct.</label><br>
<label><input type="checkbox"> I used did / didn’t + base verb.</label><br>
<label><input type="checkbox"> I checked my spelling.</label></div>
<div class="card"><p class="note">Rubric: structure (title, introduction, examples, conclusion), correct Past Simple and could/couldn’t, vocabulary, spelling and punctuation. Compare your work with your teacher’s feedback.</p><button class="alt" data-act="reveal">Reveal sample answer</button><div id="sample" hidden><p>A sample is shown above as the model. Compare your report with it, but write your own sentences.</p></div></div>`;

VIEWS.museum=()=>`<h2 tabindex="-1">Writing Workshop: A Visit to the Oman Across the Ages Museum</h2>
<div class="card" style="text-align:center"><div class="big" aria-hidden="true">🏛️ 🏺 ⛵ ☕ 🗿</div><p class="note">Teacher: Salem Rashid Al-Harbi · Imam Al-Salt bin Al-Qasim Al-Kharousi Basic Education School (Grades 5–8)</p></div>
<div class="card"><b>Your task</b> <button class="spk" data-sayel="mtask">🔊 Listen</button><p id="mtask">Write a short report about a visit to the Oman Across the Ages Museum in Manah, Oman. Use the Past Simple (visited, saw, learned, enjoyed).</p></div>
<div class="card"><b>Useful vocabulary</b>
<p><b>museum</b> — a building where interesting objects are kept and shown</p>
<p><b>exhibit</b> — an object or display shown to visitors</p>
<p><b>history</b> — what happened in the past</p>
<p><b>culture</b> — the traditions and way of life of a people</p>
<p><b>traditional</b> — old and passed down from earlier generations</p>
<p><b>ancient</b> — very old, from long ago</p>
<p><b>dhow</b> — a traditional wooden sailing boat</p>
<p><b>dallah</b> — a tall, traditional Arabic coffee pot</p>
<p><b>khanjar</b> — a traditional curved dagger worn in Oman</p>
<p><b>falaj</b> — a channel that carries water to farms</p>
<p><b>technology</b> — machines and screens that help people, such as touch screens</p>
<p><b>guide</b> — a person who shows visitors around</p></div>
${mc('m1','Which word means an object shown to visitors in a museum?',['exhibit','ticket','guide'],0,'An exhibit is an object shown in a museum.')}
<div class="card"><b>Model paragraph</b> <button class="spk" data-sayel="mpt">🔊 Listen</button><p id="mpt">Last week, I visited the Oman Across the Ages Museum in Manah with my class. The museum is in Manah, Oman, and it shows the history of our country. I saw an old dhow, traditional dallahs, and a falaj model that showed how water travelled to farms. I also saw touch screens that told stories about the past. I learned about how people in Oman lived long ago. I enjoyed the visit because I could see real objects and learn about my culture.</p></div>
${mc('m2','Which sentence is correct?',['Last week, I visit the museum.','Last week, I visited the museum.','Last week, I visiting the museum.'],1,'Use the past form visited for last week.')}
${mc('m3','Which sentence uses capital letters correctly?',['we visited the museum in manah.','We visited the museum in Manah.','We Visited the Museum in manah.'],1,'Start sentences and place names with capital letters.')}
<div class="card"><b>Sentence starters</b><ul><li>Last week, I visited…</li><li>The museum is in…</li><li>I saw…</li><li>I learned about…</li><li>I enjoyed the visit because…</li></ul></div>
<div class="card"><b>Report structure</b><p>Title → Introduction (where and when) → What I saw → What I learned → Conclusion</p></div>
<div class="card"><label for="mw"><b>My report</b></label><textarea id="mw" placeholder="Title: A Visit to the Oman Across the Ages Museum"></textarea><p>Word count: <b id="mwc">0</b></p><p><button class="spk" data-sayval="mw">🔊 Listen to my report</button></p></div>
<div class="card"><b>Checklist</b>
<label><input type="checkbox"> I wrote a title and started each sentence with a capital letter.</label><br>
<label><input type="checkbox"> I used capital letters for place names such as Oman and Manah.</label><br>
<label><input type="checkbox"> I ended each sentence with a full stop.</label><br>
<label><input type="checkbox"> I used a comma after “Last week”.</label><br>
<label><input type="checkbox"> I used past verbs: visited, saw, learned, enjoyed.</label><br>
<label><input type="checkbox"> I checked the spelling of the vocabulary words.</label></div>
<div class="card"><b>Assessment rubric</b>
<table><tr><th>Criteria</th><th>4 Excellent</th><th>3 Good</th><th>2 Developing</th><th>1 Beginning</th></tr>
<tr><td>Content</td><td>Details about 3 or more exhibits and what I learned</td><td>Details about 2 exhibits</td><td>One detail</td><td>Little or no detail</td></tr>
<tr><td>Organisation</td><td>Title, introduction, examples and conclusion in order</td><td>Most parts present</td><td>Some parts missing</td><td>No clear order</td></tr>
<tr><td>Grammar and vocabulary</td><td>Past Simple used correctly; 3 or more vocabulary words</td><td>Mostly correct; 2 words</td><td>Several errors; 1 word</td><td>Many errors</td></tr>

ACT.stage=t=>go('steps:'+t.dataset.s);
ACT.home=()=>go('home');
ACT.prev=()=>{const i=seqIndex(CUR);if(i<=0)go('home');else go(SEQ[i-1].k);};
ACT.next=()=>{ensureP();const i=seqIndex(CUR);const locked=CUR.startsWith('steps:')&&+CUR.split(':')[1]>=4&&!P.mastery;
 if(!locked&&PATH.some(s=>s.k===CUR)){P.done[CUR]=true;save();}
 const j=i<0?0:i+1;if(j<SEQ.length)go(SEQ[j].k);};
ACT.again=()=>{ensureP();document.querySelectorAll('[data-mc]').forEach(b=>{delete P.ok[b.dataset.mc];});['wr','mw','stw'].forEach(id=>{if(document.getElementById(id))delete P.drafts[id];});save();go(CUR);};
ACT.listenNow=()=>{const c=document.getElementById('main').cloneNode(true);c.querySelectorAll('button,select,textarea,input,summary').forEach(x=>x.remove());say(c.textContent.replace(/\s+/g,' ').trim().slice(0,700));};
ACT.mcheck=()=>{const n=document.querySelectorAll('[data-mc^="mk"][data-done]').length;const r=$('#mkres');
 if(n>=3){P.mastery=true;save();r.className='fb ok';r.innerHTML='Mastery passed! Stages 4 to 7 are now unlocked. <p><button data-act="stage" data-s="3">Continue to Stage 3</button></p>';}
 else{r.className='fb no';r.textContent='Answer all three mastery questions correctly first.';}};
ACT.stcheck=()=>{const boxes=[...document.querySelectorAll('.stc')];const n=boxes.filter(b=>b.checked).length;const miss=boxes.filter(b=>!b.checked).map(b=>b.parentElement.textContent.trim());const lvl=n===7?'Excellent':n>=5?'Good':'Keep practising';const r=$('#stres');r.className='fb '+(n>=5?'ok':'no');r.innerHTML=`Level: <b>${lvl}</b> (${n} of 7 ticks).`+(miss.length?`<br>Improve: ${miss.join(' ')}`:' Excellent work!');};
ACT.retry=()=>go('quiz');
ACT.print=()=>window.print();
ACT.reset=()=>{if(!confirm('Reset all progress saved in this browser?'))return;P={seen:{},best:null,last:null};save();go('home');};

function go(k){return goNav(k);}
function goOld(v){if(v!=='home'&&v!=='menu'&&v!=='results'){P.seen[v]=true;save();}
 $('main').innerHTML=VIEWS[v]();$('#hp').textContent='Grade 5 English · '+countSeen()+'/8';window.scrollTo(0,0);$('main').focus();}

document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-act]');if(!t)return;if(t.dataset.go){go(t.dataset.go);return;}const f=ACT[t.dataset.act];if(f)f(t);});
document.addEventListener('input',e=>{if(e.target.id==='wr'||e.target.id==='mw'){const n=e.target.value.split(/\s+/).filter(Boolean).length;$(e.target.id==='wr'?'#wc':'#mwc').textContent=n;}});
go('home');
</script>
</body>
</html>
